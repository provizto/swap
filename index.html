<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertukaran Aset Instan (DEX)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header>
            <h1>DEX Swap Interface</h1>
            <p>Tukar aset kripto Anda dengan aman langsung melalui jaringan blockchain publik.</p>
        </header>

        <div class="swap-card">
            <iframe 
                src="https://app.uniswap.org/#/swap?theme=dark&exactField=input&exactToken=0x2791bca1f2de4661ed88a30c99a7a9449aa84174"
                title="Uniswap Swap Widget"
                id="uniswap-iframe">
            </iframe>
        </div>

        <footer>
            <p class="disclaimer">
                *Platform ini murni berupa antarmuka grafis (UI Provider). Transaksi diproses sepenuhnya oleh smart contract pihak ketiga di luar kendali kami.
            </p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
